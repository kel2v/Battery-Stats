[versions]
#PLUGINS
    # AGP
    agp = "9.4.0"

    #Kotlin
    kotlin = "2.4.20"

    # Hilt
    hilt = "2.60.1"

    # KSP (must match Kotlin exactly)
    ksp = "2.3.6"


#Libraries
    # ComposeBom
    composeBom = "2026.09.00"

    # coreKtx
    coreKtx = "1.7.0"

    # AndroidX
    activityCompose = "1.13.0"
    runtime = "1.12.1"
    androidxCoreKtx = "1.19.0"
    hiltNavigationCompose = "1.4.0"
    lifecycleRuntimeKtx = "2.11.0"
    navigationCompose = "2.10.1"
    workRuntimeKtx = "2.11.2"

    # HiltWork
    hiltWork = "1.4.0"

    # Room
    room = "2.8.5"

    # vico
    vico = "3.3.1"

    # Test
    junit = "4.13.2"
    junitVintageEngine = "6.1.3"
    junitJupiter = "6.1.3"
    junitPlatformLauncher = "6.1.3"
    robolectric = "4.17"
    kotlinxCoroutinesTest = "1.11.0"

    # androidTest
    espressoCore = "3.7.0"
    androidxJunit = "1.3.0"
    junitKtx = "1.3.0"
    workTesting = "2.11.2"
    hiltAndroidTesting = "2.60.1"
    runner = "1.7.0"




[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
room = {id="androidx.room", version.ref = "room"}
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-devtools-ksp = {id = "com.google.devtools.ksp", version.ref = "ksp"}
google-dagger-hilt-android = {id = "com.google.dagger.hilt.android", version.ref = "hilt"}

[libraries]

# compose.bom
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# core.ktx
core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "coreKtx" }

# androidx
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCoreKtx" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntimeKtx" }

# hilt
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltWork"}

# room
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

# vico
patrykandpatrick-vico-compose = {group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico"}

# test
androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitVintageEngine" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformLauncher" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# androidTest
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "workTesting" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hiltAndroidTesting" }


# debug
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "junitKtx" }
